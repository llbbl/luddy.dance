name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  container-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the static container
        run: docker build --tag luddy-dance:ci .

      - name: Serve and verify the home page
        run: |
          docker run --detach --rm --name luddy-dance-ci --publish 8080:8080 -e PORT=8080 luddy-dance:ci
          trap 'docker stop luddy-dance-ci' EXIT
          if ! curl --fail --show-error --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8080/; then
            docker logs luddy-dance-ci
            exit 1
          fi
